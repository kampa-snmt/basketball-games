<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games · Kampa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
</head>
<body>

    <div id="header-container"></div>

    <main class="main-content">
        <div class="home-wrapper">

            <div class="welcome-section">
                <h1>🎮 Games</h1>
                <p class="welcome-text">
                    Choose a game to practice your vocabulary!
                </p>
                <p class="welcome-text-cn">
                    选择一个游戏来练习你的词汇！
                </p>
            </div>

            <div class="categories-grid">
                <a href="memory.html" class="category-card">
                    <div class="category-icon">🧠</div>
                    <div class="category-title">Memory</div>
                    <div class="category-desc">Match images with words</div>
                </a>

                <a href="quiz.html" class="category-card">
                    <div class="category-icon">🏆</div>
                    <div class="category-title">Quiz</div>
                    <div class="category-desc">Test your knowledge</div>
                </a>

                <a href="wheel.html" class="category-card">
                    <div class="category-icon">🎡</div>
                    <div class="category-title">Spinning Wheel</div>
                    <div class="category-desc">Spin and learn</div>
                </a>

                <a href="mystery.html" class="category-card">
                    <div class="category-icon">🔤</div>
                    <div class="category-title">Mystery Word</div>
                    <div class="category-desc">Guess the hidden word</div>
                </a>
            </div>

        </div>
    </main>

    <div id="footer-container"></div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
