<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quiz · Kampa Games</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">

    <style>
        /* =============================================
           ESTILOS ESPECÍFICOS DEL QUIZ
           ============================================= */
        .quiz-wrapper {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 16px 20px 18px 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-header {
            text-align: center;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.06);
        }

        .quiz-header h1 {
            font-family: 'Graduate', 'Segoe UI', sans-serif;
            font-size: 1.5rem;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.12);
            letter-spacing: 2px;
        }

        .quiz-header .subtitle {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.65rem;
            letter-spacing: 1px;
        }

        /* ---- SELECTOR (pantalla inicial) ---- */
        .selector {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 10px;
            align-items: center;
        }

        .selector-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .selector-label {
            font-family: 'Graduate', 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #FFD700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 25px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .btn-option {
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .btn-option:hover {
            color: rgba(255, 255, 255, 0.85);
        }

        .btn-option.active {
            background: #FFD700;
            color: #1a2a6c;
            box-shadow: 0 2px 12px rgba(255, 215, 0, 0.25);
        }

        .btn-start {
            padding: 14px 50px;
            font-family: 'Graduate', 'Segoe UI', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            background: #FFD700;
            color: #1a2a6c;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-start:hover {
            background: #FFE44D;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        /* ---- CONTROLES DEL JUEGO ---- */
        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 5px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            font-family: 'Segoe UI', Arial, sans-serif;
            letter-spacing: 0.3px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-gold { background: #FFD700; color: #1a2a6c; }
        .btn-gold:hover:not(:disabled) { background: #FFE44D; }

        .btn-outline {
            background: transparent;
            color: #FFD700;
            border: 1.5px solid rgba(255, 215, 0, 0.35);
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.06);
            border-color: #FFD700;
        }

        .btn-danger {
            background: rgba(220, 53, 69, 0.8);
            color: white;
        }
        .btn-danger:hover:not(:disabled) { background: #dc3545; }

        /* ---- STATUS BAR ---- */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .status-item {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .status-item strong { color: #FFD700; }

        /* Barra de progreso */
        .progress-wrapper {
            flex: 1;
            min-width: 150px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FFE44D);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Badge dificultad */
        .difficulty-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .difficulty-badge.easy {
            background: rgba(40, 167, 69, 0.15);
            color: #4caf50;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .difficulty-badge.hard {
            background: rgba(220, 53, 69, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        /* ---- ÁREA DE JUEGO ---- */
        .game-area {
            display: none;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .game-area.active {
            display: flex;
        }

        /* ---- IMAGEN DE LA PREGUNTA ---- */
        .question-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
            padding: 4px 0;
        }

        .question-image {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .question-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
        }

        .question-image .placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-size: 3rem;
        }

        /* ---- OPCIONES ---- */
        .options-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .options-grid[data-count="4"] {
            grid-template-columns: 1fr 1fr;
        }

        .options-grid[data-count="5"] {
            grid-template-columns: 1fr 1fr;
        }
        .options-grid[data-count="5"] .option-btn:last-child {
            grid-column: 1 / -1;
        }

        .options-grid[data-count="6"] {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .option-btn {
            padding: 14px 12px;
            font-size: 1.05rem;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Graduate', 'Segoe UI', sans-serif;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            animation: optionIn 0.3s ease backwards;
        }

        @keyframes optionIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            transform: scale(1.02);
        }

        .option-btn.correct {
            background: rgba(40, 167, 69, 0.3);
            border-color: #28a745;
            color: #4caf50;
            animation: correctPulse 0.5s ease;
        }

        .option-btn.wrong {
            background: rgba(220, 53, 69, 0.3);
            border-color: #dc3545;
            color: #ff6b6b;
            animation: wrongShake 0.4s ease;
        }

        .option-btn.reveal-correct {
            background: rgba(40, 167, 69, 0.15);
            border-color: rgba(40, 167, 69, 0.4);
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.disabled:hover {
            transform: none;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.05); }
            60% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ---- FEEDBACK ---- */
        .feedback-message {
            font-size: 0.95rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            min-height: 28px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-message.correct { color: #4caf50; }
        .feedback-message.wrong { color: #ff6b6b; }

        /* ---- OVERLAY VICTORIA ---- */
        .result-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .result-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .result-content {
            background: linear-gradient(145deg, #0f1f4a, #080e20);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            padding: 30px 35px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.08);
            animation: victoryIn 0.5s ease;
        }

        @keyframes victoryIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-content .trophy {
            font-size: 3.5rem;
            margin-bottom: 6px;
        }

        .result-content h2 {
            color: #FFD700;
            font-family: 'Graduate', 'Segoe UI', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 4px;
        }

        .result-content .sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-bottom: 14px;
        }

        .result-content .stats {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .result-content .stats strong { color: #FFD700; }

        .result-content .btn {
            font-size: 0.95rem;
            padding: 10px 30px;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 850px) {
            .quiz-wrapper { padding: 12px 14px 14px 14px; }
            .quiz-header h1 { font-size: 1.2rem; }
            .question-image { max-width: 180px; }
            .options-grid { max-width: 440px; gap: 10px; }
            .option-btn { font-size: 0.9rem; padding: 12px 10px; min-height: 50px; }
            .btn { padding: 4px 10px; font-size: 0.6rem; }
            .btn-start { padding: 12px 35px; font-size: 0.95rem; }
        }

        @media (max-width: 550px) {
            .quiz-wrapper { padding: 8px 8px 10px 8px; border-radius: 14px; }
            .quiz-header h1 { font-size: 1rem; }
            .question-image { max-width: 130px; }
            .options-grid { max-width: 340px; gap: 8px; }
            .option-btn { font-size: 0.75rem; padding: 10px 8px; min-height: 44px; border-radius: 10px; }
            .status-item { font-size: 0.65rem; }
            .btn { padding: 3px 8px; font-size: 0.5rem; }
            .btn-start { padding: 10px 25px; font-size: 0.85rem; }
            .btn-option { padding: 6px 14px; font-size: 0.75rem; }
        }

        @media (max-width: 400px) {
            .question-image { max-width: 100px; }
            .options-grid { max-width: 280px; gap: 6px; }
            .option-btn { font-size: 0.65rem; padding: 8px 6px; min-height: 38px; }
            .quiz-header h1 { font-size: 0.85rem; }
        }

        @media (min-height: 900px) {
            .quiz-wrapper { padding: 20px 30px 24px 30px; }
            .question-image { max-width: 280px; }
            .options-grid { max-width: 620px; gap: 16px; }
            .option-btn { font-size: 1.2rem; padding: 18px 16px; min-height: 70px; }
            .quiz-header h1 { font-size: 2rem; }
            .btn { padding: 8px 20px; font-size: 0.85rem; }
            .btn-start { padding: 16px 60px; font-size: 1.2rem; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- HEADER (inyectado) -->
    <div id="header-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div class="quiz-wrapper">

            <!-- TÍTULO -->
            <div class="quiz-header">
                <h1>🏆 QUIZ</h1>
                <div class="subtitle">Choose the correct word for each image</div>
            </div>

            <!-- ============================================ -->
            <!-- SELECTOR (pantalla inicial) -->
            <!-- ============================================ -->
            <div class="selector" id="selectorPanel">

                <!-- Cantidad de palabras -->
                <div class="selector-section">
                    <div class="selector-label">Words to guess</div>
                    <div class="btn-group" id="wordsGroup">
                        <button class="btn-option active" data-words="4">4</button>
                        <button class="btn-option" data-words="8">8</button>
                        <button class="btn-option" data-words="12">12</button>
                        <button class="btn-option" data-words="16">16</button>
                    </div>
                </div>

                <!-- Dificultad -->
                <div class="selector-section">
                    <div class="selector-label">Difficulty</div>
                    <div class="btn-group" id="difficultyGroup">
                        <button class="btn-option active" data-difficulty="easy">⭐ Easy</button>
                        <button class="btn-option" data-difficulty="hard">⭐⭐⭐ Hard</button>
                    </div>
                </div>

                <!-- Botón START -->
                <button class="btn-start" id="startBtn">🎮 START QUIZ</button>

            </div>

            <!-- ============================================ -->
            <!-- ZONA DE JUEGO -->
            <!-- ============================================ -->
            <div id="gameArea" class="game-area">

                <!-- CONTROLES -->
                <div class="controls">
                    <button class="btn btn-outline" id="newGameBtn">🔄 New</button>
                    <button class="btn btn-danger" id="backBtn">⬅️ Back</button>
                </div>

                <!-- STATUS BAR -->
                <div class="status-bar">
                    <div class="progress-wrapper">
                        <span style="color:rgba(255,255,255,0.4);font-size:0.8rem;">📊</span>
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="status-item" id="progressText">0 / 8</span>
                    </div>
                    <div class="difficulty-badge easy" id="difficultyBadge">⭐ Easy</div>
                </div>

                <!-- IMAGEN -->
                <div class="question-container">
                    <div class="question-image" id="questionImage">
                        <div class="placeholder">🏀</div>
                    </div>
                </div>

                <!-- OPCIONES -->
                <div class="options-grid" id="optionsGrid" data-count="4"></div>

                <!-- FEEDBACK -->
                <div class="feedback-message" id="feedbackMessage">💡 Choose the correct word!</div>

            </div>

        </div>
    </main>

    <!-- FOOTER (inyectado) -->
    <div id="footer-container"></div>

    <!-- OVERLAY RESULTADO -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-content">
            <div class="trophy" id="resultEmoji">🏆</div>
            <h2 id="resultTitle">¡Completaste el Quiz!</h2>
            <div class="sub" id="resultSub">Great job!</div>
            <div class="stats" id="resultStats">✅ 8 / 8 correctas</div>
            <button class="btn btn-gold" id="playAgainBtn">🔄 Play Again</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>

    <script>
        // =========================================================
        // ESTADO DEL QUIZ
        // =========================================================
        let quizState = {
            questions: [],
            currentIndex: 0,
            score: 0,
            answered: false,
            isComplete: false,
            config: {
                numWords: 4,
                difficulty: 'easy'
            }
        };

        let optionBtns = [];

        // =========================================================
        // DOM
        // =========================================================
        const selectorPanel = document.getElementById('selectorPanel');
        const gameArea = document.getElementById('gameArea');
        const wordsGroup = document.getElementById('wordsGroup');
        const difficultyGroup = document.getElementById('difficultyGroup');
        const startBtn = document.getElementById('startBtn');
        const questionImage = document.getElementById('questionImage');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const difficultyBadge = document.getElementById('difficultyBadge');
        const newGameBtn = document.getElementById('newGameBtn');
        const backBtn = document.getElementById('backBtn');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultEmoji = document.getElementById('resultEmoji');
        const resultTitle = document.getElementById('resultTitle');
        const resultSub = document.getElementById('resultSub');
        const resultStats = document.getElementById('resultStats');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // =========================================================
        // HELPERS
        // =========================================================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // =========================================================
        // DIFICULTAD PROGRESIVA POR POSICIÓN
        // =========================================================
        function getOptionCount(questionPosition, totalQuestions) {
            const ratio = questionPosition / totalQuestions;
            if (ratio < 0.25) return 4;
            if (ratio < 0.50) return 4;
            if (ratio < 0.75) return 5;
            return 6;
        }

        // =========================================================
        // AGRUPOS DE PALABRAS PARECIDAS (para modo HARD)
        // =========================================================
        function getSimilarWords(word, allWords) {
            const others = allWords.filter(w => w !== word);
            const w = word.toUpperCase();

            // 1. Misma letra inicial
            const sameFirst = others.filter(o => o.toUpperCase()[0] === w[0]);

            // 2. Longitud similar (±2)
            const sameLength = others.filter(o => Math.abs(o.length - word.length) <= 2);

            // 3. Sonido inicial similar (primera sílaba)
            const wPrefix = w.substring(0, 2);
            const sameSound = others.filter(o => o.toUpperCase().substring(0, 2) === wPrefix);

            // Combinar y priorizar
            const combined = new Set();
            sameSound.forEach(o => combined.add(o));
            sameFirst.forEach(o => combined.add(o));
            sameLength.forEach(o => combined.add(o));

            // Convertir a array y barajar
            const similar = shuffleArray([...combined]);

            // Si no hay suficientes, rellenar con aleatorias
            const remaining = shuffleArray(others.filter(o => !combined.has(o)));
            return [...similar, ...remaining];
        }

        // =========================================================
        // GENERAR PREGUNTAS
        // =========================================================
        function generateQuestions() {
            // Elegir N palabras aleatorias
            const allWords = PALABRAS_JUEGO.map(p => p.palabra);
            const shuffled = shuffleArray([...allWords]);
            const selectedWords = shuffled.slice(0, quizState.config.numWords);

            // Para cada palabra, elegir una imagen aleatoria
            const selectedWithImages = selectedWords.map(word => {
                const item = PALABRAS_JUEGO.find(p => p.palabra === word);
                const randomIdx = Math.floor(Math.random() * item.imagenes.length);
                return {
                    palabra: word,
                    imagen: item.imagenes[randomIdx],
                    rutaCompleta: RUTA_TERMS + item.imagenes[randomIdx]
                };
            });

            const questions = [];
            let lastCorrectIndex = -1;

            for (let pos = 0; pos < selectedWithImages.length; pos++) {
                const item = selectedWithImages[pos];
                const correctWord = item.palabra;
                const optionCount = getOptionCount(pos, selectedWithImages.length);
                const numWrong = optionCount - 1;

                // Elegir distractores
                let distractors;

                if (quizState.config.difficulty === 'hard') {
                    // Modo HARD: buscar palabras parecidas
                    const similares = getSimilarWords(correctWord, allWords);
                    distractors = similares.slice(0, numWrong);
                } else {
                    // Modo EASY: aleatorias
                    const wrongWords = allWords.filter(w => w !== correctWord);
                    const shuffledWrong = shuffleArray([...wrongWords]);
                    distractors = shuffledWrong.slice(0, numWrong);
                }

                const options = [correctWord, ...distractors];

                // Barajar opciones y evitar que la correcta esté en la misma posición seguida
                let shuffledOptions;
                let correctIndex;
                let attempts = 0;
                const maxAttempts = 25;

                do {
                    shuffledOptions = shuffleArray([...options]);
                    correctIndex = shuffledOptions.indexOf(correctWord);
                    attempts++;
                } while (correctIndex === lastCorrectIndex && attempts < maxAttempts);

                lastCorrectIndex = correctIndex;

                questions.push({
                    imagen: item.rutaCompleta,
                    palabra: correctWord,
                    options: shuffledOptions,
                    correctIndex: correctIndex,
                    optionCount: optionCount
                });
            }

            return questions;
        }

        // =========================================================
        // CREAR BOTONES DE OPCIÓN
        // =========================================================
        function createOptionButtons(count) {
            optionsGrid.innerHTML = '';
            optionsGrid.dataset.count = count;
            optionBtns = [];
            for (let i = 0; i < count; i++) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.index = i;
                btn.style.animationDelay = `${i * 0.05}s`;
                btn.addEventListener('click', () => handleAnswer(i));
                optionsGrid.appendChild(btn);
                optionBtns.push(btn);
            }
        }

        // =========================================================
        // CARGAR PREGUNTA
        // =========================================================
        function loadQuestion(index) {
            const question = quizState.questions[index];
            if (!question) return;

            quizState.answered = false;

            createOptionButtons(question.optionCount);

            // Imagen
            const img = document.createElement('img');
            img.src = question.imagen;
            img.alt = 'Question image';
            img.onerror = function() {
                // Intentar con JPG
                const jpgPath = this.src.replace('.png', '.jpg');
                this.src = jpgPath;
                this.onerror = function() {
                    this.style.display = 'none';
                    const placeholder = document.createElement('div');
                    placeholder.className = 'placeholder';
                    placeholder.textContent = '🖼️';
                    questionImage.innerHTML = '';
                    questionImage.appendChild(placeholder);
                };
            };
            questionImage.innerHTML = '';
            questionImage.appendChild(img);

            // Opciones
            question.options.forEach((word, idx) => {
                if (optionBtns[idx]) {
                    optionBtns[idx].textContent = word;
                    optionBtns[idx].dataset.correct = (idx === question.correctIndex) ? 'true' : 'false';
                }
            });

            // Progreso
            const total = quizState.questions.length;
            const progress = (index / total) * 100;
            progressFill.style.width = `${progress}%`;
            progressText.textContent = `${index} / ${total}`;

            // Badge
            if (quizState.config.difficulty === 'easy') {
                difficultyBadge.className = 'difficulty-badge easy';
                difficultyBadge.textContent = '⭐ Easy';
            } else {
                difficultyBadge.className = 'difficulty-badge hard';
                difficultyBadge.textContent = '⭐⭐⭐ Hard';
            }

            feedbackMessage.textContent = '💡 Choose the correct word!';
            feedbackMessage.className = 'feedback-message';
        }

        // =========================================================
        // RESPUESTA
        // =========================================================
        function handleAnswer(index) {
            if (quizState.answered || quizState.isComplete) return;
            if (quizState.currentIndex >= quizState.questions.length) return;
            if (!optionBtns[index]) return;

            const question = quizState.questions[quizState.currentIndex];
            const selectedBtn = optionBtns[index];
            const isCorrect = (index === question.correctIndex);

            quizState.answered = true;
            optionBtns.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                quizState.score++;
                feedbackMessage.textContent = `✅ Correct! "${question.palabra}"`;
                feedbackMessage.className = 'feedback-message correct';
            } else {
                selectedBtn.classList.add('wrong');
                optionBtns.forEach((btn, idx) => {
                    if (idx === question.correctIndex) {
                        btn.classList.add('reveal-correct');
                    }
                });
                feedbackMessage.textContent = `❌ Oops! The correct answer is "${question.palabra}"`;
                feedbackMessage.className = 'feedback-message wrong';
            }

            setTimeout(() => {
                quizState.currentIndex++;
                if (quizState.currentIndex >= quizState.questions.length) {
                    showFinalResult();
                } else {
                    loadQuestion(quizState.currentIndex);
                }
            }, 1500);
        }

        // =========================================================
        // RESULTADO FINAL
        // =========================================================
        function showFinalResult() {
            quizState.isComplete = true;
            const total = quizState.questions.length;
            const score = quizState.score;
            const percentage = Math.round((score / total) * 100);

            let emoji, title, sub;
            if (percentage === 100) {
                emoji = '🏆';
                title = '¡Perfecto!';
                sub = 'You got all answers correct! 🎉';
            } else if (percentage >= 75) {
                emoji = '🌟';
                title = '¡Muy bien!';
                sub = 'Great job! Keep it up! 💪';
            } else if (percentage >= 50) {
                emoji = '📚';
                title = '¡Buen intento!';
                sub = 'Practice makes perfect! 📖';
            } else {
                emoji = '💪';
                title = '¡Sigue practicando!';
                sub = 'Don\'t give up! Try again! 🏀';
            }

            resultEmoji.textContent = emoji;
            resultTitle.textContent = title;
            resultSub.textContent = sub;
            resultStats.innerHTML = `✅ <strong>${score}</strong> / ${total} · <strong>${percentage}%</strong>`;

            progressFill.style.width = '100%';
            progressText.textContent = `${total} / ${total}`;

            setTimeout(() => {
                resultOverlay.classList.add('active');
            }, 400);
        }

        // =========================================================
        // INICIO / NAVEGACIÓN
        // =========================================================
        function startQuiz() {
            quizState.questions = generateQuestions();
            quizState.currentIndex = 0;
            quizState.score = 0;
            quizState.answered = false;
            quizState.isComplete = false;

            selectorPanel.classList.add('hidden');
            gameArea.classList.add('active');
            resultOverlay.classList.remove('active');

            feedbackMessage.textContent = '💡 Choose the correct word!';
            feedbackMessage.className = 'feedback-message';

            if (quizState.questions.length > 0) {
                loadQuestion(0);
            }
        }

        function backToSelector() {
            if (!quizState.isComplete && quizState.currentIndex > 0) {
                if (!confirm('Are you sure you want to go back? Progress will be lost.')) return;
            }
            quizState.isComplete = false;
            gameArea.classList.remove('active');
            selectorPanel.classList.remove('hidden');
            resultOverlay.classList.remove('active');
        }

        // =========================================================
        // SELECTOR
        // =========================================================
        wordsGroup.querySelectorAll('.btn-option').forEach(btn => {
            btn.addEventListener('click', () => {
                wordsGroup.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                quizState.config.numWords = parseInt(btn.dataset.words);
            });
        });

        difficultyGroup.querySelectorAll('.btn-option').forEach(btn => {
            btn.addEventListener('click', () => {
                difficultyGroup.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                quizState.config.difficulty = btn.dataset.difficulty;
            });
        });

        // =========================================================
        // EVENT LISTENERS
        // =========================================================
        startBtn.addEventListener('click', startQuiz);
        newGameBtn.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
            backToSelector();
        });
        backBtn.addEventListener('click', backToSelector);
        playAgainBtn.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
            backToSelector();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '6') {
                const index = parseInt(e.key) - 1;
                if (index < optionBtns.length && !optionBtns[index].disabled) {
                    handleAnswer(index);
                }
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                backToSelector();
            }
        });

        console.log('🏆 QUIZ - ready');
        console.log('📝 ' + PALABRAS_JUEGO.length + ' palabras disponibles en config.js');
    </script>
</body>
</html>
